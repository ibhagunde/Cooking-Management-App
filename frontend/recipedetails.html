<!DOCTYPE html>
<html>
<head>
    <title>Recipe Details</title>
    <link rel="stylesheet" href="recipe-details.css">
</head>

<body>

<div class="container">

    <div class="recipe-header">

        <h1 id="title">Loading...</h1>

    <div class="card description-card">

        <h3>Recipe Info</h3>

        <p>
            <strong>Category:</strong>
            <span id="category-info"></span>
        </p>

        <p>
            <strong>Prep Time:</strong>
            <span id="prep-time"></span>
        </p>

        <p>
            <strong>Cook Time:</strong>
            <span id="cook-time"></span>
        </p>

    </div>


    <div class="recipe-grid">

        <div class="card">

            <h3>Ingredients</h3>

            <ul id="ingredients"></ul>

        </div>


        <div class="card">

            <h3>Instructions</h3>

            <ol id="instructions"></ol>

        </div>

    </div>


    <div class="buttons">

        <button class="grocery-btn" onclick="addToGroceryList()">
            Add to Grocery List
        </button>

        <button class="back-btn" onclick="history.back()">
            ← Back
        </button>

    </div>

</div>

</div>

    </div>

    <script src="recipedetails.js"></script>

</body>
</html>
