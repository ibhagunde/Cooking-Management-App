<!DOCTYPE html>
<html>
<head>
    <title>Recipe Details</title>
    <link rel="stylesheet" href="recipedetails.css">
</head>

<body>

<div class="container">

    <button class="back-btn" onclick="history.back()">
        ← Back
    </button>

    <h1 id="title">Loading...</h1>

    <h3>Recipe Information</h3>

    <div class="recipe-info">

        <div class="info-card">
            <h4>Category</h4>
            <p id="category-info"></p>
        </div>

        <div class="info-card">
            <h4>Prep Time</h4>
            <p id="prep-time"></p>
        </div>

        <div class="info-card">
            <h4>Cook Time</h4>
            <p id="cook-time"></p>
        </div>

    </div>
        <button class="grocery-btn" onclick="addToGroceryList()">
        Add to Grocery List
    </button>

    <div class="card">

        <h3>Ingredients</h3>

        <ul id="ingredients" class="recipe-list"></ul>

    </div>

    <div class="card">

        <h3>Instructions</h3>

        <ol id="instructions" class="instruction-list"></ol>

    </div>

</div>

<script src="recipedetails.js"></script>

</body>
</html>
